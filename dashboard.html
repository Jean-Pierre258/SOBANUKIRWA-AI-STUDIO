
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard | SOBANUKIRWA AI STUDIO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">

<header class="topbar">
  <a class="brand" href="dashboard.html">SOBANUKIRWA <span>AI STUDIO</span></a>
  <nav>
    <span id="userName"></span>
    <a href="projects.html">Projects</a>
    <a href="admin.html">Admin</a>
    <button class="btn secondary" data-logout>Logout</button>
  </nav>
</header>

<main class="container">
  <div id="notice" class="notice" hidden></div>
  <h1 id="welcome">Your Dashboard</h1>
  <p>Manage your video projects.</p>

  <div class="grid">
    <div class="stat">
      <b id="projectCount">0</b>
      <span>My Projects</span>
    </div>
    <div class="stat">
      <b>FREE</b>
      <span>Current Plan</span>
    </div>
    <div class="stat">
      <b>PHASE 1</b>
      <span>Workspace</span>
    </div>
    <div class="stat">
      <b>AI</b>
      <span>Coming Soon</span>
    </div>
  </div>

  <section class="panel" style="margin-top:22px">
    <h2>Recent Projects</h2>
    <div id="recentProjects"></div>
    <a class="btn" href="projects.html">Create Project</a>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register | SOBANUKIRWA AI STUDIO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">SOBANUKIRWA <span>AI STUDIO</span></a>
  <nav><a href="login.html">Login</a></nav>
</header>

<main class="auth-wrap">
  <section class="auth-card">
    <h2>Create Account</h2>
    <p>Register using your email address.</p>
    <div id="notice" class="notice" hidden></div>

    <form id="registerForm">
      <label>Full Name</label>
      <input id="name" required maxlength="100">

      <label>Email</label>
      <input id="email" type="email" required>

      <label>Password</label>
      <input id="password" type="password" minlength="10" required>

      <button class="btn" type="submit">Register</button>
    </form>

    <p>Already registered? <a href="login.html">Login</a></p>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>

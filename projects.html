
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects | SOBANUKIRWA AI STUDIO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="projects">

<header class="topbar">
  <a class="brand" href="dashboard.html">SOBANUKIRWA <span>AI STUDIO</span></a>
  <nav>
    <span id="userName"></span>
    <a href="dashboard.html">Dashboard</a>
    <button class="btn secondary" data-logout>Logout</button>
  </nav>
</header>

<main class="container">
  <h1>My Projects</h1>
  <div id="notice" class="notice" hidden></div>

  <section class="panel">
    <h2>Create New Project</h2>

    <form id="projectForm">
      <label>Project Title</label>
      <input id="title" maxlength="120" required>

      <label>Description</label>
      <textarea id="description"></textarea>

      <button class="btn" type="submit">Create Project</button>
    </form>
  </section>

  <div id="projectList" class="project-grid"></div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
